<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2480" height="3508" viewBox="0 0 2480 3508">
<defs>
  <style><![CDATA[
    @font-face { font-family: NotoSansLocal; src: url('../../01_research/fonts/NotoSansSC[wght].ttf'); }
    @font-face { font-family: NotoSerifLocal; src: url('../../01_research/fonts/NotoSerifSC[wght].ttf'); }
    @font-face { font-family: InterLocal; src: url('../../01_research/fonts/InterVariable.ttf'); }
    .sans { font-family: NotoSansLocal, sans-serif; }
    .serif { font-family: NotoSerifLocal, serif; }
    .latin { font-family: InterLocal, sans-serif; }
  ]]></style>
  <linearGradient id="softGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E8D29B"/><stop offset="1" stop-color="#C29A55"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#071B20" flood-opacity=".22"/></filter>
</defs>
<rect width="2480" height="3508" fill="#F0E7D4"/>
<path d="M-160 3020 C540 2600 760 3420 1450 3140 S2260 2700 2700 3020" fill="none" stroke="#C29A55" stroke-width="3" opacity=".18"/>

<g id="header">
  <text x="160" y="178" class="latin" font-size="22" font-weight="750" text-anchor="start" fill="#C29A55" opacity="1.0" letter-spacing="4">03 / 08</text>
  <text x="160" y="308" class="serif" font-size="90" font-weight="780" text-anchor="start" fill="#173B46" opacity="1.0" letter-spacing="2">四步完成一次城市印记</text>
  <text x="162" y="372" class="latin" font-size="25" font-weight="480" text-anchor="start" fill="#787C78" opacity="0.72" letter-spacing="2">USE FLOW · 收纳、抽拉、取章、归位</text>
  <path d="M160 438 H2320" stroke="#C29A55" stroke-width="4" opacity=".68"/>
</g>


<g id="states">
  <g transform="translate(130 560)"><rect x="0" y="0" width="700" height="1560" rx="38" fill="#FAF6EC" stroke="#D7C7A8" stroke-width="3"/><image href="../../04_renders/interaction_01.png" x="20" y="90" width="660" height="690" opacity="1.0" preserveAspectRatio="xMidYMid meet"/><text x="60" y="900" class="serif" font-size="37" font-weight="720" text-anchor="start" fill="#173B46" opacity="1.0" letter-spacing="0.0">01 · 收纳</text><text x="60" y="970" class="sans" font-size="24" font-weight="400" text-anchor="start" fill="#787C78" opacity="1.0" letter-spacing="0.0">闭合时保持克制轮廓，</text><text x="60" y="1018" class="sans" font-size="24" font-weight="400" text-anchor="start" fill="#787C78" opacity="1.0" letter-spacing="0.0">地图与印台分别隔离。</text></g>
  <g transform="translate(890 560)"><rect x="0" y="0" width="700" height="1560" rx="38" fill="#FAF6EC" stroke="#D7C7A8" stroke-width="3"/><image href="../../04_renders/interaction_03.png" x="20" y="90" width="660" height="690" opacity="1.0" preserveAspectRatio="xMidYMid meet"/><text x="60" y="900" class="serif" font-size="37" font-weight="720" text-anchor="start" fill="#173B46" opacity="1.0" letter-spacing="0.0">02 · 抽拉</text><text x="60" y="970" class="sans" font-size="24" font-weight="400" text-anchor="start" fill="#787C78" opacity="1.0" letter-spacing="0.0">章盘沿单向导轨显露，</text><text x="60" y="1018" class="sans" font-size="24" font-weight="400" text-anchor="start" fill="#787C78" opacity="1.0" letter-spacing="0.0">最大展示行程 92 mm。</text></g>
  <g transform="translate(1650 560)"><rect x="0" y="0" width="700" height="1560" rx="38" fill="#FAF6EC" stroke="#D7C7A8" stroke-width="3"/><image href="../../04_renders/interaction_04.png" x="20" y="90" width="660" height="690" opacity="1.0" preserveAspectRatio="xMidYMid meet"/><text x="60" y="900" class="serif" font-size="37" font-weight="720" text-anchor="start" fill="#173B46" opacity="1.0" letter-spacing="0.0">03 · 取章</text><text x="60" y="970" class="sans" font-size="24" font-weight="400" text-anchor="start" fill="#787C78" opacity="1.0" letter-spacing="0.0">六枚模块章独立取用，</text><text x="60" y="1018" class="sans" font-size="24" font-weight="400" text-anchor="start" fill="#787C78" opacity="1.0" letter-spacing="0.0">归位后拼成城市路径。</text></g>
  <rect x="130" y="2240" width="2220" height="710" rx="48" fill="#173B46"/>
  <image href="../../04_renders/hero_open.png" x="1180" y="2240" width="1100" height="710" opacity="1.0" preserveAspectRatio="xMidYMid meet"/>
  <text x="210" y="2370" class="serif" font-size="44" font-weight="720" text-anchor="start" fill="#F0E7D4" opacity="1.0" letter-spacing="0.0">一次完整使用，不依赖手机</text>
  <text x="210" y="2470" class="sans" font-size="28" font-weight="400" text-anchor="start" fill="#F0E7D4" opacity="1.0" letter-spacing="0.0">拉出地图 → 选择节点 → 取章蘸印</text><text x="210" y="2530" class="sans" font-size="28" font-weight="400" text-anchor="start" fill="#F0E7D4" opacity="1.0" letter-spacing="0.0">完成记录 → 擦净章面 → 归位收纳</text>
  <text x="210" y="2735" class="sans" font-size="18" font-weight="620" text-anchor="start" fill="#C29A55" opacity="1.0" letter-spacing="0.0">抽拉行程</text>
  <text x="210" y="2820" class="latin" font-size="54" font-weight="760" text-anchor="start" fill="#F0E7D4" opacity="1.0" letter-spacing="0.0">92 mm</text>
  <text x="530" y="2735" class="sans" font-size="18" font-weight="620" text-anchor="start" fill="#C29A55" opacity="1.0" letter-spacing="0.0">单枚章体</text>
  <text x="530" y="2820" class="latin" font-size="44" font-weight="760" text-anchor="start" fill="#F0E7D4" opacity="1.0" letter-spacing="0.0">32 × 32 × 23</text>
</g>


<g id="footer" opacity=".55">
  <path d="M160 3350 H2320" stroke="#173B46" stroke-width="2"/>
  <text x="160" y="3408" class="latin" font-size="16" font-weight="540" text-anchor="start" fill="#173B46" opacity="1.0" letter-spacing="4">BUBUSHENGDIAN · HANDAN CULTURAL WALK</text>
  <text x="2320" y="3408" class="latin" font-size="16" font-weight="700" text-anchor="end" fill="#C29A55" opacity="1.0" letter-spacing="2">03</text>
</g>

</svg>
