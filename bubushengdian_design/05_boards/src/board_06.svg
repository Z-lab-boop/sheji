<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2480" height="3508" viewBox="0 0 2480 3508">
<defs>
  <style><![CDATA[
    @font-face { font-family: NotoSansLocal; src: url('../../01_research/fonts/NotoSansSC[wght].ttf'); }
    @font-face { font-family: NotoSerifLocal; src: url('../../01_research/fonts/NotoSerifSC[wght].ttf'); }
    @font-face { font-family: InterLocal; src: url('../../01_research/fonts/InterVariable.ttf'); }
    .sans { font-family: NotoSansLocal, sans-serif; }
    .serif { font-family: NotoSerifLocal, serif; }
    .latin { font-family: InterLocal, sans-serif; }
  ]]></style>
  <linearGradient id="softGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E8D29B"/><stop offset="1" stop-color="#C29A55"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#071B20" flood-opacity=".22"/></filter>
</defs>
<rect width="2480" height="3508" fill="#F0E7D4"/>
<path d="M-160 3020 C540 2600 760 3420 1450 3140 S2260 2700 2700 3020" fill="none" stroke="#C29A55" stroke-width="3" opacity=".18"/>

<g id="header">
  <text x="160" y="178" class="latin" font-size="22" font-weight="750" text-anchor="start" fill="#C29A55" opacity="1.0" letter-spacing="4">06 / 08</text>
  <text x="160" y="308" class="serif" font-size="90" font-weight="780" text-anchor="start" fill="#173B46" opacity="1.0" letter-spacing="2">一匣两季，全年可用</text>
  <text x="162" y="372" class="latin" font-size="25" font-weight="480" text-anchor="start" fill="#787C78" opacity="0.72" letter-spacing="2">SEASONAL EDITIONS · 中秋夜游与国庆漫游</text>
  <path d="M160 438 H2320" stroke="#C29A55" stroke-width="4" opacity=".68"/>
</g>


<g id="festival-scenarios">
  <g transform="translate(120 540)">
    <rect width="1080" height="1850" rx="56" fill="#102F38"/>
    <circle cx="780" cy="370" r="240" fill="#C29A55" opacity=".16"/>
    <circle cx="780" cy="370" r="160" fill="none" stroke="#C29A55" stroke-width="5"/>
    <text x="80" y="105" class="latin" font-size="18" font-weight="720" text-anchor="start" fill="#C29A55" opacity="1.0" letter-spacing="4">MID-AUTUMN</text>
    <text x="80" y="185" class="serif" font-size="52" font-weight="740" text-anchor="start" fill="#F0E7D4" opacity="1.0" letter-spacing="0.0">月下邯郸</text>
    <image href="../../02_identity/folding_map.svg" x="55" y="280" width="970" height="760" opacity="1.0" preserveAspectRatio="xMidYMid meet"/>
    <text x="80" y="1150" class="sans" font-size="30" font-weight="650" text-anchor="start" fill="#F0E7D4" opacity="1.0" letter-spacing="0.0">夜游路线卡</text>
    <text x="80" y="1220" class="sans" font-size="24" font-weight="360" text-anchor="start" fill="#F0E7D4" opacity="1.0" letter-spacing="0.0">月相金线只改变路线图层，</text><text x="80" y="1270" class="sans" font-size="24" font-weight="360" text-anchor="start" fill="#F0E7D4" opacity="1.0" letter-spacing="0.0">章匣结构与全年版保持一致。</text>
    <image href="../../04_renders/map_unfolded.png" x="80" y="1390" width="920" height="360" opacity="1.0" preserveAspectRatio="xMidYMid meet"/>
  </g>
  <g transform="translate(1280 540)">
    <rect width="1080" height="1850" rx="56" fill="#FAF6EC" stroke="#D4C29C" stroke-width="3"/>
    <path d="M680 190 L770 80 L850 170 L940 45 L1020 190 Z" fill="none" stroke="#B23A32" stroke-width="9"/>
    <text x="80" y="105" class="latin" font-size="18" font-weight="720" text-anchor="start" fill="#B23A32" opacity="1.0" letter-spacing="4">NATIONAL DAY</text>
    <text x="80" y="185" class="serif" font-size="52" font-weight="740" text-anchor="start" fill="#173B46" opacity="1.0" letter-spacing="0.0">山河同游</text>
    <image href="../../04_renders/hero_open.png" x="45" y="260" width="990" height="820" opacity="1.0" preserveAspectRatio="xMidYMid meet"/>
    <text x="80" y="1150" class="sans" font-size="30" font-weight="650" text-anchor="start" fill="#173B46" opacity="1.0" letter-spacing="0.0">黄金周城市漫游</text>
    <text x="80" y="1220" class="sans" font-size="24" font-weight="360" text-anchor="start" fill="#787C78" opacity="1.0" letter-spacing="0.0">提高印泥朱与路线节点比例，</text><text x="80" y="1270" class="sans" font-size="24" font-weight="360" text-anchor="start" fill="#787C78" opacity="1.0" letter-spacing="0.0">不使用国旗变形或泛庆典贴图。</text>
    <image href="../../04_renders/scale_view.png" x="80" y="1390" width="920" height="360" opacity="1.0" preserveAspectRatio="xMidYMid meet"/>
  </g>
  <rect x="120" y="2490" width="2240" height="480" rx="46" fill="#173B46"/>
  <text x="200" y="2610" class="serif" font-size="40" font-weight="720" text-anchor="start" fill="#F0E7D4" opacity="1.0" letter-spacing="0.0">节日是场景，不是文化替代</text>
  <text x="200" y="2700" class="sans" font-size="25" font-weight="360" text-anchor="start" fill="#F0E7D4" opacity="1.0" letter-spacing="0.0">产品全年可售；中秋与国庆只替换两枚限定章和一张路线卡。</text><text x="200" y="2755" class="sans" font-size="25" font-weight="360" text-anchor="start" fill="#F0E7D4" opacity="1.0" letter-spacing="0.0">所有活动、营业时间与优惠信息均不写入固定展板，避免动态信息失真。</text>
</g>


<g id="footer" opacity=".55">
  <path d="M160 3350 H2320" stroke="#173B46" stroke-width="2"/>
  <text x="160" y="3408" class="latin" font-size="16" font-weight="540" text-anchor="start" fill="#173B46" opacity="1.0" letter-spacing="4">BUBUSHENGDIAN · HANDAN CULTURAL WALK</text>
  <text x="2320" y="3408" class="latin" font-size="16" font-weight="700" text-anchor="end" fill="#C29A55" opacity="1.0" letter-spacing="2">06</text>
</g>

</svg>
