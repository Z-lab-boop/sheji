<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2480" height="3508" viewBox="0 0 2480 3508">
<defs>
  <style><![CDATA[
    @font-face { font-family: NotoSansLocal; src: url('../../01_research/fonts/NotoSansSC[wght].ttf'); }
    @font-face { font-family: NotoSerifLocal; src: url('../../01_research/fonts/NotoSerifSC[wght].ttf'); }
    @font-face { font-family: InterLocal; src: url('../../01_research/fonts/InterVariable.ttf'); }
    .sans { font-family: NotoSansLocal, sans-serif; }
    .serif { font-family: NotoSerifLocal, serif; }
    .latin { font-family: InterLocal, sans-serif; }
  ]]></style>
  <linearGradient id="softGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E8D29B"/><stop offset="1" stop-color="#C29A55"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#071B20" flood-opacity=".22"/></filter>
</defs>
<rect width="2480" height="3508" fill="#F0E7D4"/>
<path d="M-160 3020 C540 2600 760 3420 1450 3140 S2260 2700 2700 3020" fill="none" stroke="#C29A55" stroke-width="3" opacity=".18"/>

<g id="header">
  <text x="160" y="178" class="latin" font-size="22" font-weight="750" text-anchor="start" fill="#C29A55" opacity="1.0" letter-spacing="4">02 / 08</text>
  <text x="160" y="308" class="serif" font-size="90" font-weight="780" text-anchor="start" fill="#173B46" opacity="1.0" letter-spacing="2">从学步，到走出自己的路</text>
  <text x="162" y="372" class="latin" font-size="25" font-weight="480" text-anchor="start" fill="#787C78" opacity="0.72" letter-spacing="2">IDIOM TO INTERACTION · 准确保留典故本义</text>
  <path d="M160 438 H2320" stroke="#C29A55" stroke-width="4" opacity=".68"/>
</g>


<g id="culture-translation">
  
<g transform="translate(160 660)">
  <rect width="1020" height="640" rx="44" fill="#FAF6EC" stroke="#D4C29C" stroke-width="3"/>
  <circle cx="120" cy="120" r="62" fill="#173B46"/>
  <text x="120" y="142" class="serif" font-size="54" font-weight="760" text-anchor="middle" fill="#F0E7D4" opacity="1.0" letter-spacing="0.0">学</text>
  <text x="220" y="84" class="latin" font-size="18" font-weight="760" text-anchor="start" fill="#C29A55" opacity="1.0" letter-spacing="3">01</text>
  <text x="220" y="150" class="serif" font-size="42" font-weight="720" text-anchor="start" fill="#173B46" opacity="1.0" letter-spacing="0.0">典故本义</text>
  <text x="80" y="285" class="sans" font-size="28" font-weight="380" text-anchor="start" fill="#172022" opacity="1.0" letter-spacing="0.0">盲目模仿他人步法，反而失去自己</text><text x="80" y="337" class="sans" font-size="28" font-weight="380" text-anchor="start" fill="#172022" opacity="1.0" letter-spacing="0.0">的本领。</text>
  <path d="M80 500 H920" stroke="#C29A55" stroke-width="5" opacity=".45"/>
  <text x="80" y="560" class="sans" font-size="21" font-weight="500" text-anchor="start" fill="#787C78" opacity="1.0" letter-spacing="1">从故事出发</text>
</g>
<g transform="translate(1270 660)">
  <rect width="1020" height="640" rx="44" fill="#FAF6EC" stroke="#D4C29C" stroke-width="3"/>
  <circle cx="120" cy="120" r="62" fill="#173B46"/>
  <text x="120" y="142" class="serif" font-size="54" font-weight="760" text-anchor="middle" fill="#F0E7D4" opacity="1.0" letter-spacing="0.0">走</text>
  <text x="220" y="84" class="latin" font-size="18" font-weight="760" text-anchor="start" fill="#C29A55" opacity="1.0" letter-spacing="3">02</text>
  <text x="220" y="150" class="serif" font-size="42" font-weight="720" text-anchor="start" fill="#173B46" opacity="1.0" letter-spacing="0.0">当代反思</text>
  <text x="80" y="285" class="sans" font-size="28" font-weight="380" text-anchor="start" fill="#172022" opacity="1.0" letter-spacing="0.0">旅行不是复制攻略，而是亲自理解</text><text x="80" y="337" class="sans" font-size="28" font-weight="380" text-anchor="start" fill="#172022" opacity="1.0" letter-spacing="0.0">一座城市。</text>
  <path d="M80 500 H920" stroke="#C29A55" stroke-width="5" opacity=".45"/>
  <text x="80" y="560" class="sans" font-size="21" font-weight="500" text-anchor="start" fill="#787C78" opacity="1.0" letter-spacing="1">把理解变成行动</text>
</g>
<g transform="translate(160 1420)">
  <rect width="1020" height="640" rx="44" fill="#FAF6EC" stroke="#D4C29C" stroke-width="3"/>
  <circle cx="120" cy="120" r="62" fill="#173B46"/>
  <text x="120" y="142" class="serif" font-size="54" font-weight="760" text-anchor="middle" fill="#F0E7D4" opacity="1.0" letter-spacing="0.0">印</text>
  <text x="220" y="84" class="latin" font-size="18" font-weight="760" text-anchor="start" fill="#C29A55" opacity="1.0" letter-spacing="3">03</text>
  <text x="220" y="150" class="serif" font-size="42" font-weight="720" text-anchor="start" fill="#173B46" opacity="1.0" letter-spacing="0.0">产品动作</text>
  <text x="80" y="285" class="sans" font-size="28" font-weight="380" text-anchor="start" fill="#172022" opacity="1.0" letter-spacing="0.0">抵达文化节点，取章、蘸印、完成</text><text x="80" y="337" class="sans" font-size="28" font-weight="380" text-anchor="start" fill="#172022" opacity="1.0" letter-spacing="0.0">一枚印记。</text>
  <path d="M80 500 H920" stroke="#C29A55" stroke-width="5" opacity=".45"/>
  <text x="80" y="560" class="sans" font-size="21" font-weight="500" text-anchor="start" fill="#787C78" opacity="1.0" letter-spacing="1">让路线留下痕迹</text>
</g>
<g transform="translate(1270 1420)">
  <rect width="1020" height="640" rx="44" fill="#FAF6EC" stroke="#D4C29C" stroke-width="3"/>
  <circle cx="120" cy="120" r="62" fill="#173B46"/>
  <text x="120" y="142" class="serif" font-size="54" font-weight="760" text-anchor="middle" fill="#F0E7D4" opacity="1.0" letter-spacing="0.0">记</text>
  <text x="220" y="84" class="latin" font-size="18" font-weight="760" text-anchor="start" fill="#C29A55" opacity="1.0" letter-spacing="3">04</text>
  <text x="220" y="150" class="serif" font-size="42" font-weight="720" text-anchor="start" fill="#173B46" opacity="1.0" letter-spacing="0.0">个人路线</text>
  <text x="80" y="285" class="sans" font-size="28" font-weight="380" text-anchor="start" fill="#172022" opacity="1.0" letter-spacing="0.0">日期、地点与一句感受共同形成自</text><text x="80" y="337" class="sans" font-size="28" font-weight="380" text-anchor="start" fill="#172022" opacity="1.0" letter-spacing="0.0">己的邯郸。</text>
  <path d="M80 500 H920" stroke="#C29A55" stroke-width="5" opacity=".45"/>
  <text x="80" y="560" class="sans" font-size="21" font-weight="500" text-anchor="start" fill="#787C78" opacity="1.0" letter-spacing="1">不摹他人步，自成一城路</text>
</g>
  <rect x="160" y="2200" width="2160" height="680" rx="50" fill="#173B46"/>
  <text x="230" y="2310" class="serif" font-size="44" font-weight="720" text-anchor="start" fill="#F0E7D4" opacity="1.0" letter-spacing="0.0">文化不是贴图，而是一段可完成的行为</text>
  <path d="M250 2550 C660 2260 860 2780 1230 2500 S1820 2320 2190 2540" fill="none" stroke="#C29A55" stroke-width="12" stroke-linecap="round" stroke-dasharray="2 26"/>
  <text x="250" y="2740" class="sans" font-size="26" font-weight="620" text-anchor="start" fill="#F0E7D4" opacity="1.0" letter-spacing="0.0">走到现场</text>
  <text x="850" y="2740" class="sans" font-size="26" font-weight="620" text-anchor="start" fill="#F0E7D4" opacity="1.0" letter-spacing="0.0">完成印记</text>
  <text x="1450" y="2740" class="sans" font-size="26" font-weight="620" text-anchor="start" fill="#F0E7D4" opacity="1.0" letter-spacing="0.0">写下理解</text>
  <text x="2180" y="2740" class="sans" font-size="26" font-weight="620" text-anchor="end" fill="#F0E7D4" opacity="1.0" letter-spacing="0.0">形成自己的路线</text>
  <text x="160" y="3010" class="sans" font-size="21" font-weight="380" text-anchor="start" fill="#787C78" opacity="1.0" letter-spacing="0.0">典故说明依据河北省文化和旅游厅公开资料；文化路线示意，不代表实时导航。</text>
</g>


<g id="footer" opacity=".55">
  <path d="M160 3350 H2320" stroke="#173B46" stroke-width="2"/>
  <text x="160" y="3408" class="latin" font-size="16" font-weight="540" text-anchor="start" fill="#173B46" opacity="1.0" letter-spacing="4">BUBUSHENGDIAN · HANDAN CULTURAL WALK</text>
  <text x="2320" y="3408" class="latin" font-size="16" font-weight="700" text-anchor="end" fill="#C29A55" opacity="1.0" letter-spacing="2">02</text>
</g>

</svg>
