<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700">
  <defs>
    <style><![CDATA[
      .cn-serif { font-family: "Noto Serif SC", serif; }
      .cn-sans { font-family: "Noto Sans SC", sans-serif; }
      .latin { font-family: Inter, sans-serif; }
    ]]></style>
    <filter id="paper" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence baseFrequency="0.9" numOctaves="2" seed="17" type="fractalNoise" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="g"/>
      <feBlend in="SourceGraphic" in2="g" mode="soft-light"/>
    </filter>
  </defs>

  <rect width="1600" height="700" rx="48" fill="#F0E7D4"/>
  <g id="custom-route-mark" transform="translate(105 105)">
    <rect width="480" height="480" rx="80" fill="#173B46"/>
    <path d="M92 370 H190 V280 H286 V180 H390" fill="none" stroke="#C29A55" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="92" cy="370" r="25" fill="#B23A32"/>
    <circle cx="190" cy="280" r="16" fill="#F0E7D4"/>
    <circle cx="286" cy="180" r="16" fill="#F0E7D4"/>
    <path d="M366 142 L426 180 L366 218 Z" fill="#C29A55"/>
    <path d="M100 100 H260 M100 100 V205" stroke="#F0E7D4" stroke-width="12" opacity=".3"/>
  </g>
  <g transform="translate(680 130)">
    <text x="0" y="220" class="cn-serif" font-size="210" font-weight="800" fill="#173B46" letter-spacing="18">步步生典</text>
    <path d="M4 286 H765" stroke="#C29A55" stroke-width="8"/>
    <circle cx="742" cy="286" r="18" fill="#B23A32"/>
    <text x="4" y="360" class="latin" font-size="34" font-weight="650" fill="#173B46" letter-spacing="10">STEP INTO HANDAN</text>
    <text x="4" y="430" class="cn-sans" font-size="34" fill="#173B46" opacity=".72">每一步，都走进一则成语</text>
  </g>

</svg>
