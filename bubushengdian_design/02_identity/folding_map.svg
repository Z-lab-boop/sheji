</g><g transform="translate(260 96)">
  <circle r="13" fill="#F0E7D4" stroke="#C29A55" stroke-width="2"/>
  <text y="2.5" class="latin" text-anchor="middle" font-size="6" font-weight="750" fill="#173B46">03</text>
