<text x="190" y="2680" class="sans" font-size="23" font-weight="400" text-anchor="start" fill="#858B86" opacity="1.0" letter-spacing="0">数字模型验证分件、包络、行程与中性格式可读性；纸板膨胀、裱糊累积、</text><text x="190" y="2730" class="sans" font-size="23" font-weight="400" text-anchor="start" fill="#858B86" opacity="1.0" letter-spacing="0">满载摩擦、锁片撕裂、30 次开合、跌落与运输振动仍须实体样机验证。</text>
