<rect x="120" y="520" width="2240" height="760" rx="56" fill="#202F32"/><image href="../../04_renders/hero_open.png" x="1120" y="490" width="1180" height="760" opacity="1.0" preserveAspectRatio="xMidYMid meet"/><text x="210" y="660" class="latin" font-size="18" font-weight="760" text-anchor="start" fill="#C19A55" opacity="1.0" letter-spacing="4">TECHNICAL CANDIDATE</text><text x="210" y="760" class="serif" font-size="56" font-weight="760" text-anchor="start" fill="#EEE4D0" opacity="1.0" letter-spacing="0">技术候选稿</text><text x="210" y="850" class="serif" font-size="48" font-weight="760" text-anchor="start" fill="#A83B32" opacity="1.0" letter-spacing="0">目前不能正式投稿</text><text x="210" y="955" class="sans" font-size="25" font-weight="390" text-anchor="start" fill="#EEE4D0" opacity="1.0" letter-spacing="0">结构、刀模、渲染与展板已完成；</text><text x="210" y="1007" class="sans" font-size="25" font-weight="390" text-anchor="start" fill="#EEE4D0" opacity="1.0" letter-spacing="0">真实商品和品牌授权尚未进入项目。</text>
<g transform="translate(120 1400)"><rect x="0" y="0" width="700" height="780" rx="38" fill="#FAF6EC" stroke="#D6C7A8" stroke-width="3"/><text x="55" y="90" class="latin" font-size="18" font-weight="720" text-anchor="start" fill="#C19A55" opacity="1.0" letter-spacing="2">MISSING 01</text><text x="55" y="170" class="serif" font-size="38" font-weight="720" text-anchor="start" fill="#202F32" opacity="1.0" letter-spacing="0">真实 SKU</text><text x="55" y="270" class="sans" font-size="23" font-weight="420" text-anchor="start" fill="#858B86" opacity="1.0" letter-spacing="0">实测长宽高与重量</text><text x="55" y="327" class="sans" font-size="23" font-weight="420" text-anchor="start" fill="#858B86" opacity="1.0" letter-spacing="0">商品数量与排列优先级</text><text x="55" y="384" class="sans" font-size="23" font-weight="420" text-anchor="start" fill="#858B86" opacity="1.0" letter-spacing="0">六面包装照片</text><text x="55" y="441" class="sans" font-size="23" font-weight="420" text-anchor="start" fill="#858B86" opacity="1.0" letter-spacing="0">运输与防护要求</text></g>
<g transform="translate(890 1400)"><rect x="0" y="0" width="700" height="780" rx="38" fill="#FAF6EC" stroke="#D6C7A8" stroke-width="3"/><text x="55" y="90" class="latin" font-size="18" font-weight="720" text-anchor="start" fill="#C19A55" opacity="1.0" letter-spacing="2">MISSING 02</text><text x="55" y="170" class="serif" font-size="38" font-weight="720" text-anchor="start" fill="#202F32" opacity="1.0" letter-spacing="0">品牌与法定信息</text><text x="55" y="270" class="sans" font-size="23" font-weight="420" text-anchor="start" fill="#858B86" opacity="1.0" letter-spacing="0">矢量 Logo 与授权范围</text><text x="55" y="327" class="sans" font-size="23" font-weight="420" text-anchor="start" fill="#858B86" opacity="1.0" letter-spacing="0">可用品牌色和禁用方式</text><text x="55" y="384" class="sans" font-size="23" font-weight="420" text-anchor="start" fill="#858B86" opacity="1.0" letter-spacing="0">食品名称 / 净含量 / 配料</text><text x="55" y="441" class="sans" font-size="23" font-weight="420" text-anchor="start" fill="#858B86" opacity="1.0" letter-spacing="0">生产者与责任边界</text></g>
<g transform="translate(1660 1400)"><rect x="0" y="0" width="700" height="780" rx="38" fill="#FAF6EC" stroke="#D6C7A8" stroke-width="3"/><text x="55" y="90" class="latin" font-size="18" font-weight="720" text-anchor="start" fill="#C19A55" opacity="1.0" letter-spacing="2">MISSING 03</text><text x="55" y="170" class="serif" font-size="38" font-weight="720" text-anchor="start" fill="#202F32" opacity="1.0" letter-spacing="0">投稿身份</text><text x="55" y="270" class="sans" font-size="23" font-weight="420" text-anchor="start" fill="#858B86" opacity="1.0" letter-spacing="0">作者 / 学校 / 指导教师</text><text x="55" y="327" class="sans" font-size="23" font-weight="420" text-anchor="start" fill="#858B86" opacity="1.0" letter-spacing="0">真实联系方式</text><text x="55" y="384" class="sans" font-size="23" font-weight="420" text-anchor="start" fill="#858B86" opacity="1.0" letter-spacing="0">最终文件命名规则</text><text x="55" y="441" class="sans" font-size="23" font-weight="420" text-anchor="start" fill="#858B86" opacity="1.0" letter-spacing="0">主办方最新报名表</text></g>
<rect x="120" y="2320" width="2240" height="620" rx="50" fill="#172529"/><text x="200" y="2450" class="latin" font-size="18" font-weight="720" text-anchor="start" fill="#C19A55" opacity="1.0" letter-spacing="3">COST POSITION</text><text x="200" y="2550" class="latin" font-size="48" font-weight="760" text-anchor="start" fill="#EEE4D0" opacity="1.0" letter-spacing="0">¥80–160</text><text x="200" y="2610" class="sans" font-size="20" font-weight="420" text-anchor="start" fill="#EEE4D0" opacity="1.0" letter-spacing="0">概念样机包装，不含食品</text><text x="720" y="2550" class="latin" font-size="48" font-weight="760" text-anchor="start" fill="#EEE4D0" opacity="1.0" letter-spacing="0">¥18–32</text><text x="720" y="2610" class="sans" font-size="20" font-weight="420" text-anchor="start" fill="#EEE4D0" opacity="1.0" letter-spacing="0">量产目标区间，需供应商重算</text><text x="200" y="2760" class="sans" font-size="20" font-weight="700" text-anchor="start" fill="#C19A55" opacity="1.0" letter-spacing="0">醒目标注</text><text x="200" y="2840" class="sans" font-size="36" font-weight="760" text-anchor="start" fill="#A83B32" opacity="1.0" letter-spacing="0">规格代理件，非实际商品包装</text><text x="2160" y="2840" class="latin" font-size="34" font-weight="760" text-anchor="end" fill="#C19A55" opacity="1.0" letter-spacing="0">BLOCKED</text></g>
