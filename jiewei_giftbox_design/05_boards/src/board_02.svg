<g id="header">
 <text x="160" y="178" class="latin" font-size="22" font-weight="760" text-anchor="start" fill="#C19A55" opacity="1.0" letter-spacing="4">02 / 06</text>
 <text x="160" y="308" class="serif" font-size="82" font-weight="780" text-anchor="start" fill="#202F32" opacity="1.0" letter-spacing="2">把典故变成必须遵守的动作</text>
 <text x="162" y="374" class="latin" font-size="23" font-weight="480" text-anchor="start" fill="#202F32" opacity="0.68" letter-spacing="2">IDIOM TO MECHANISM · 围—移—解—见</text>
 <path d="M160 438 H2320" stroke="#C19A55" stroke-width="4" opacity=".72"/>
</g><g id="culture"><g transform="translate(150 570)"><rect x="0" y="0" width="1020" height="620" rx="38" fill="#FAF6EC" stroke="#D6C7A8" stroke-width="3"/><circle cx="118" cy="120" r="64" fill="#202F32"/><text x="118" y="143" class="serif" font-size="52" font-weight="760" text-anchor="middle" fill="#EEE4D0" opacity="1.0" letter-spacing="0">围</text><text x="220" y="78" class="latin" font-size="18" font-weight="760" text-anchor="start" fill="#C19A55" opacity="1.0" letter-spacing="3">01</text><text x="220" y="148" class="serif" font-size="37" font-weight="720" text-anchor="start" fill="#202F32" opacity="1.0" letter-spacing="0">避开正面强攻</text><text x="80" y="286" class="sans" font-size="25" font-weight="390" text-anchor="start" fill="#858B86" opacity="1.0" letter-spacing="0">典故中的关键不是战争图像，而是先改</text><text x="80" y="333" class="sans" font-size="25" font-weight="390" text-anchor="start" fill="#858B86" opacity="1.0" letter-spacing="0">变外围条件。</text><text x="80" y="380" class="sans" font-size="25" font-weight="390" text-anchor="start" fill="#858B86" opacity="1.0" letter-spacing="0"></text><path d="M80 504 H920" stroke="#C19A55" stroke-width="4" opacity=".48"/></g><g transform="translate(1260 570)"><rect x="0" y="0" width="1020" height="620" rx="38" fill="#FAF6EC" stroke="#D6C7A8" stroke-width="3"/><circle cx="118" cy="120" r="64" fill="#A83B32"/><text x="118" y="143" class="serif" font-size="52" font-weight="760" text-anchor="middle" fill="#EEE4D0" opacity="1.0" letter-spacing="0">移</text><text x="220" y="78" class="latin" font-size="18" font-weight="760" text-anchor="start" fill="#C19A55" opacity="1.0" letter-spacing="3">02</text><text x="220" y="148" class="serif" font-size="37" font-weight="720" text-anchor="start" fill="#202F32" opacity="1.0" letter-spacing="0">侧向状态先改变</text><text x="80" y="286" class="sans" font-size="25" font-weight="390" text-anchor="start" fill="#858B86" opacity="1.0" letter-spacing="0">红色“魏”侧抽屉先移动 42 mm</text><text x="80" y="333" class="sans" font-size="25" font-weight="390" text-anchor="start" fill="#858B86" opacity="1.0" letter-spacing="0">，带动双锁钥片。</text><text x="80" y="380" class="sans" font-size="25" font-weight="390" text-anchor="start" fill="#858B86" opacity="1.0" letter-spacing="0"></text><path d="M80 504 H920" stroke="#C19A55" stroke-width="4" opacity=".48"/></g><g transform="translate(150 1300)"><rect x="0" y="0" width="1020" height="620" rx="38" fill="#FAF6EC" stroke="#D6C7A8" stroke-width="3"/><circle cx="118" cy="120" r="64" fill="#202F32"/><text x="118" y="143" class="serif" font-size="52" font-weight="760" text-anchor="middle" fill="#EEE4D0" opacity="1.0" letter-spacing="0">解</text><text x="220" y="78" class="latin" font-size="18" font-weight="760" text-anchor="start" fill="#C19A55" opacity="1.0" letter-spacing="3">03</text><text x="220" y="148" class="serif" font-size="37" font-weight="720" text-anchor="start" fill="#202F32" opacity="1.0" letter-spacing="0">两点限制同时释放</text><text x="80" y="286" class="sans" font-size="25" font-weight="390" text-anchor="start" fill="#858B86" opacity="1.0" letter-spacing="0">获得 1.2 mm 数字释放余量后</text><text x="80" y="333" class="sans" font-size="25" font-weight="390" text-anchor="start" fill="#858B86" opacity="1.0" letter-spacing="0">，中央托盘可以运动。</text><text x="80" y="380" class="sans" font-size="25" font-weight="390" text-anchor="start" fill="#858B86" opacity="1.0" letter-spacing="0"></text><path d="M80 504 H920" stroke="#C19A55" stroke-width="4" opacity=".48"/></g><g transform="translate(1260 1300)"><rect x="0" y="0" width="1020" height="620" rx="38" fill="#FAF6EC" stroke="#D6C7A8" stroke-width="3"/><circle cx="118" cy="120" r="64" fill="#202F32"/><text x="118" y="143" class="serif" font-size="52" font-weight="760" text-anchor="middle" fill="#EEE4D0" opacity="1.0" letter-spacing="0">见</text><text x="220" y="78" class="latin" font-size="18" font-weight="760" text-anchor="start" fill="#C19A55" opacity="1.0" letter-spacing="3">04</text><text x="220" y="148" class="serif" font-size="37" font-weight="720" text-anchor="start" fill="#202F32" opacity="1.0" letter-spacing="0">六地风物中央显现</text><text x="80" y="286" class="sans" font-size="25" font-weight="390" text-anchor="start" fill="#858B86" opacity="1.0" letter-spacing="0">“赵”托盘前行 145 mm，六味</text><text x="80" y="333" class="sans" font-size="25" font-weight="390" text-anchor="start" fill="#858B86" opacity="1.0" letter-spacing="0">模块形成完整陈列面。</text><text x="80" y="380" class="sans" font-size="25" font-weight="390" text-anchor="start" fill="#858B86" opacity="1.0" letter-spacing="0"></text><path d="M80 504 H920" stroke="#C19A55" stroke-width="4" opacity=".48"/></g>
<rect x="150" y="2130" width="2130" height="760" rx="52" fill="#202F32"/>
<text x="230" y="2280" class="serif" font-size="43" font-weight="720" text-anchor="start" fill="#EEE4D0" opacity="1.0" letter-spacing="0">不是贴一幅古画，而是把成语变成动作约束</text>
<path d="M250 2550 H720 V2440 H1210 V2600 H1710 V2470 H2170" fill="none" stroke="#A83B32" stroke-width="15"/><circle cx="2170" cy="2470" r="22" fill="#C19A55"/>
<text x="250" y="2720" class="sans" font-size="24" font-weight="620" text-anchor="start" fill="#EEE4D0" opacity="1.0" letter-spacing="0">围合</text><text x="770" y="2720" class="sans" font-size="24" font-weight="620" text-anchor="start" fill="#EEE4D0" opacity="1.0" letter-spacing="0">侧移</text><text x="1260" y="2720" class="sans" font-size="24" font-weight="620" text-anchor="start" fill="#EEE4D0" opacity="1.0" letter-spacing="0">解锁</text><text x="2170" y="2720" class="sans" font-size="24" font-weight="620" text-anchor="end" fill="#EEE4D0" opacity="1.0" letter-spacing="0">中央见礼</text>
<text x="160" y="3030" class="sans" font-size="21" font-weight="400" text-anchor="start" fill="#858B86" opacity="1.0" letter-spacing="0">机构借用“围魏救赵”的行动关系，不复原具体战争场景。</text></g>
<g id="footer" opacity=".58"><path d="M160 3350 H2320" stroke="#202F32" stroke-width="2"/>
<text x="160" y="3408" class="latin" font-size="16" font-weight="520" text-anchor="start" fill="#202F32" opacity="1.0" letter-spacing="2">JIEWEI · HANBAOFANG SIX FLAVOURS OF HANDAN · CONCEPT PROPOSAL</text>
<text x="2320" y="3408" class="latin" font-size="16" font-weight="720" text-anchor="end" fill="#C19A55" opacity="1.0" letter-spacing="2">02</text></g></svg>