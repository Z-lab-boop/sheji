<g transform="translate(120 540)"><rect x="0" y="0" width="1080" height="1780" rx="38" fill="#202F32" stroke="#C19A55" stroke-width="3"/><image href="../../04_renders/mid_autumn_variant.png" x="20" y="70" width="1040" height="900" opacity="1.0" preserveAspectRatio="xMidYMid meet"/><text x="70" y="1090" class="serif" font-size="52" font-weight="740" text-anchor="start" fill="#EEE4D0" opacity="1.0" letter-spacing="0">月满中秋</text><text x="72" y="1140" class="latin" font-size="18" font-weight="650" text-anchor="start" fill="#C19A55" opacity="1.0" letter-spacing="3">MID-AUTUMN EDITION</text><text x="70" y="1260" class="sans" font-size="25" font-weight="400" text-anchor="start" fill="#EEE4D0" opacity="1.0" letter-spacing="0">月宣白 × 赵月金</text><text x="70" y="1318" class="sans" font-size="25" font-weight="400" text-anchor="start" fill="#EEE4D0" opacity="1.0" letter-spacing="0">以月璧窗口形成节庆焦点</text><text x="70" y="1376" class="sans" font-size="25" font-weight="400" text-anchor="start" fill="#EEE4D0" opacity="1.0" letter-spacing="0">保留相同侧移解锁动作</text><circle cx="870" cy="1390" r="105" fill="none" stroke="#C19A55" stroke-width="5"/></g>
<g transform="translate(1280 540)"><rect x="0" y="0" width="1080" height="1780" rx="38" fill="#FAF6EC" stroke="#D6C7A8" stroke-width="3"/><image href="../../04_renders/national_day_variant.png" x="20" y="70" width="1040" height="900" opacity="1.0" preserveAspectRatio="xMidYMid meet"/><text x="70" y="1090" class="serif" font-size="52" font-weight="740" text-anchor="start" fill="#202F32" opacity="1.0" letter-spacing="0">山河同庆</text><text x="72" y="1140" class="latin" font-size="18" font-weight="650" text-anchor="start" fill="#A83B32" opacity="1.0" letter-spacing="3">NATIONAL DAY EDITION</text><text x="70" y="1260" class="sans" font-size="25" font-weight="400" text-anchor="start" fill="#858B86" opacity="1.0" letter-spacing="0">河山青 × 迂回朱</text><text x="70" y="1318" class="sans" font-size="25" font-weight="400" text-anchor="start" fill="#858B86" opacity="1.0" letter-spacing="0">山线与路径强调共同出发</text><text x="70" y="1376" class="sans" font-size="25" font-weight="400" text-anchor="start" fill="#858B86" opacity="1.0" letter-spacing="0">不堆叠旗帜或战争符号</text><path d="M760 1480 L850 1380 L930 1460 L1020 1330" fill="none" stroke="#A83B32" stroke-width="6"/></g>
<rect x="120" y="2420" width="2240" height="500" rx="48" fill="#202F32"/><text x="200" y="2540" class="serif" font-size="42" font-weight="720" text-anchor="start" fill="#EEE4D0" opacity="1.0" letter-spacing="0">一个机构，两层节庆表达</text><text x="200" y="2640" class="sans" font-size="23" font-weight="380" text-anchor="start" fill="#EEE4D0" opacity="1.0" letter-spacing="0">共享字标、月璧窗口、路线构图、品牌区与法定信息区；只切换季节图层与 CMF。</text><text x="200" y="2692" class="sans" font-size="23" font-weight="380" text-anchor="start" fill="#EEE4D0" opacity="1.0" letter-spacing="0">品牌区待授权资产｜法定信息区待真实文案｜不得仿制邯宝坊未提供的官方标志。</text><text x="200" y="2820" class="sans" font-size="23" font-weight="700" text-anchor="start" fill="#A83B32" opacity="1.0" letter-spacing="0">规格代理件，非实际商品包装</text></g>
