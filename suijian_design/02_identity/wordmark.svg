<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">遂见品牌字标</title>
  <desc id="desc">Editable vector artwork for the Suijian cultural product system.</desc>
  <style>@font-face { font-family: 'Noto Sans SC'; src: url('../01_research/fonts/NotoSansSC%5Bwght%5D.ttf'); }
@font-face { font-family: 'Noto Serif SC'; src: url('../01_research/fonts/NotoSerifSC%5Bwght%5D.ttf'); }
@font-face { font-family: 'Inter'; src: url('../01_research/fonts/InterVariable.ttf'); }
.sans { font-family: 'Noto Sans SC', sans-serif; }
.serif { font-family: 'Noto Serif SC', serif; }
.latin { font-family: 'Inter', sans-serif; letter-spacing: .12em; }</style>
  
<rect width="1200" height="420" rx="36" fill="#0D2F32"/>
<path d="M0 335 L1200 335" stroke="#B68B48" stroke-width="2" opacity=".42"/>

<g id="suijian-custom-mark" transform="translate(70 70) scale(1.15)" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <path d="M28 176 C68 126 93 137 118 112 L206 112" stroke="#B68B48" stroke-width="18"/>
  <path d="M26 196 C82 230 156 234 230 202" stroke="#E8DFCC" stroke-width="17"/>
  <path d="M114 40 H216 V164 M142 40 V132 H188 V40 M145 164 L125 205 M190 164 L218 202" stroke="#E8DFCC" stroke-width="16"/>
  <path d="M74 62 L238 14" stroke="#B68B48" stroke-width="9"/>
  <circle cx="238" cy="14" r="9" fill="#A64032" stroke="none"/>
</g>

<g id="custom-lettering" transform="translate(390 78)">
  <text class="serif" x="0" y="170" fill="#E8DFCC" font-size="158" font-weight="720" letter-spacing="18">遂见</text>
  <path d="M12 198 L372 90" stroke="#B68B48" stroke-width="7" opacity=".95"/>
  <circle cx="373" cy="90" r="8" fill="#A64032"/>
</g>
<text class="latin" x="792" y="170" fill="#B68B48" font-size="38" font-weight="620">SUIJIAN</text>
<text class="sans" x="793" y="228" fill="#E8DFCC" font-size="30" font-weight="350" letter-spacing="5">让才能，被看见</text>
<text class="serif" x="70" y="378" fill="#E8DFCC" font-size="20" opacity=".70" letter-spacing="3">锥处囊中，颖自见</text>
<text class="latin" x="1140" y="378" text-anchor="end" fill="#E8DFCC" font-size="15" opacity=".52">HANDAN · 2026</text>

</svg>
