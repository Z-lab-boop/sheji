<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1600" role="img" aria-labelledby="title desc">
  <title id="title">遂见包装概念刀模</title>
  <desc id="desc">Editable vector artwork for the Suijian cultural product system.</desc>
  <style>@font-face { font-family: 'Noto Sans SC'; src: url('../01_research/fonts/NotoSansSC%5Bwght%5D.ttf'); }
@font-face { font-family: 'Noto Serif SC'; src: url('../01_research/fonts/NotoSerifSC%5Bwght%5D.ttf'); }
@font-face { font-family: 'Inter'; src: url('../01_research/fonts/InterVariable.ttf'); }
.sans { font-family: 'Noto Sans SC', sans-serif; }
.serif { font-family: 'Noto Serif SC', serif; }
.latin { font-family: 'Inter', sans-serif; letter-spacing: .12em; }</style>
  
<rect width="2400" height="1600" fill="#FAF8F2"/>
<g id="legend" transform="translate(100 92)">
  <text class="serif" x="0" y="0" fill="#0D2F32" font-size="52" font-weight="700">遂见 · 抽屉礼盒刀模</text>
  <text class="latin" x="0" y="46" fill="#16191A" font-size="16" opacity=".58">MODEL / NOT FOR PRODUCTION · FINISHED 128 × 86 × 24 mm</text>
  <path d="M0 92 H120" stroke="#A64032" stroke-width="5"/><text class="sans" x="140" y="101" font-size="22">切线 CUT</text>
  <path d="M320 92 H440" stroke="#3A79B8" stroke-width="4" stroke-dasharray="20 12"/><text class="sans" x="460" y="101" font-size="22">折线 FOLD</text>
</g>
<g id="sleeve-dieline" transform="translate(150 330)">
  <text class="latin" x="0" y="-42" fill="#0D2F32" font-size="20" font-weight="700">OUTER SLEEVE</text>
  <path d="M0 0 H1280 V240 H2140 V520 H1280 V760 H0 Z" fill="none" stroke="#A64032" stroke-width="5"/>
  <path d="M1280 0 V760 M0 240 H2140 M0 520 H2140" fill="none" stroke="#3A79B8" stroke-width="4" stroke-dasharray="20 12"/>
  <rect x="60" y="300" width="1120" height="160" rx="24" fill="#0D2F32"/>
  <path d="M90 435 L1120 128" stroke="#B68B48" stroke-width="9"/>
  <text class="serif" x="110" y="405" fill="#E8DFCC" font-size="68" font-weight="700">遂见</text>
  <text class="sans" x="380" y="406" fill="#E8DFCC" font-size="25" letter-spacing="4">让才能，被看见</text>
</g>
<g id="drawer-dieline" transform="translate(210 1190)">
  <text class="latin" x="0" y="-38" fill="#0D2F32" font-size="20" font-weight="700">INNER DRAWER</text>
  <path d="M0 0 H240 V-120 H1520 V0 H1760 V280 H1520 V400 H240 V280 H0 Z" fill="none" stroke="#A64032" stroke-width="5"/>
  <path d="M240 0 V280 M1520 0 V280 M240 0 H1520 M240 280 H1520" fill="none" stroke="#3A79B8" stroke-width="4" stroke-dasharray="20 12"/>
  <path d="M804 0 A76 76 0 0 0 956 0" fill="none" stroke="#A64032" stroke-width="5"/>
</g>
<text class="sans" x="2240" y="1515" text-anchor="end" fill="#16191A" font-size="20" opacity=".58">结构尺寸需在实体打样后校正 · 当前为概念模型刀模</text>

</svg>
