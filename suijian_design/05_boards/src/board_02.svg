<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2480 3508" width="2480" height="3508">
<title>从典故到交互</title>

<defs>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="24" result="blur"/>
    <feOffset dy="34" result="offset"/>
    <feColorMatrix in="offset" type="matrix" values="0 0 0 0 0.02 0 0 0 0 0.12 0 0 0 0 0.13 0 0 0 .28 0"/>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <linearGradient id="goldLine" x1="0" y1="1" x2="1" y2="0">
    <stop offset="0" stop-color="#8D672F"/><stop offset=".55" stop-color="#B68B48"/><stop offset="1" stop-color="#E0BD79"/>
  </linearGradient>
  <radialGradient id="deepGlow" cx="78%" cy="18%" r="84%">
    <stop offset="0" stop-color="#1C5557"/><stop offset=".56" stop-color="#0D2F32"/><stop offset="1" stop-color="#071E20"/>
  </radialGradient>
  <style>
    @font-face { font-family:'Noto Sans SC'; src:url('../../01_research/fonts/NotoSansSC%5Bwght%5D.ttf'); }
    @font-face { font-family:'Noto Serif SC'; src:url('../../01_research/fonts/NotoSerifSC%5Bwght%5D.ttf'); }
    @font-face { font-family:'Inter'; src:url('../../01_research/fonts/InterVariable.ttf'); }
    .sans { font-family:'Noto Sans SC',sans-serif; }
    .serif { font-family:'Noto Serif SC',serif; }
    .latin { font-family:'Inter',sans-serif; }
  </style>
</defs>

<rect width="2480" height="3508" fill="#F3EEE2"/>

<path d="M-180 3060 L2680 2210" stroke="#B68B48" stroke-width="4" opacity=".13"/>
<circle cx="2290" cy="170" r="12" fill="#A64032"/>


<g id="header">
  <text class="latin" x="160" y="188" fill="#B68B48" font-size="22" font-weight="700" text-anchor="start" opacity="1.0" letter-spacing="4">02 / 07</text>
  <text class="serif" x="160" y="318" fill="#0D2F32" font-size="92" font-weight="720" text-anchor="start" opacity="1.0" letter-spacing="4">从典故到交互</text>
  <text class="sans" x="162" y="380" fill="#16191A" font-size="27" font-weight="350" text-anchor="start" opacity="0.68" letter-spacing="2">CULTURE BECOMES ACTION · 文化不是装饰，而是使用方式</text>
  <path d="M160 442 H2320" stroke="#B68B48" stroke-width="4" opacity=".65"/>
</g>



<g transform="translate(160 690)">
  <rect width="500" height="780" rx="40" fill="#FFFFFF" stroke="#B68B48" stroke-width="3"/>
  <text class="latin" x="52" y="82" fill="#B68B48" font-size="18" font-weight="700" text-anchor="start" opacity="1.0" letter-spacing="3">01</text>
  <text class="serif" x="250" y="365" fill="#0D2F32" font-size="210" font-weight="700" text-anchor="middle" opacity="1.0" letter-spacing="0">囊</text>
  <path d="M70 440 H430" stroke="#B68B48" stroke-width="6"/>
  <text class="serif" x="250" y="535" fill="#0D2F32" font-size="40" font-weight="650" text-anchor="middle" opacity="1.0" letter-spacing="6">收纳</text>
  <text class="sans" x="250" y="603" fill="#16191A" font-size="23" font-weight="350" text-anchor="middle" opacity="0.72" letter-spacing="0">深青外匣保护卡片</text>
</g>

<g transform="translate(715 690)">
  <rect width="500" height="780" rx="40" fill="#0D2F32" stroke="#B68B48" stroke-width="3"/>
  <text class="latin" x="52" y="82" fill="#B68B48" font-size="18" font-weight="700" text-anchor="start" opacity="1.0" letter-spacing="3">02</text>
  <text class="serif" x="250" y="365" fill="#E8DFCC" font-size="210" font-weight="700" text-anchor="middle" opacity="1.0" letter-spacing="0">锥</text>
  <path d="M70 440 H430" stroke="#B68B48" stroke-width="6"/>
  <text class="serif" x="250" y="535" fill="#E8DFCC" font-size="40" font-weight="650" text-anchor="middle" opacity="1.0" letter-spacing="6">推动</text>
  <text class="sans" x="250" y="603" fill="#E8DFCC" font-size="23" font-weight="350" text-anchor="middle" opacity="0.72" letter-spacing="0">17°斜线引导动作</text>
</g>

<g transform="translate(1270 690)">
  <rect width="500" height="780" rx="40" fill="#FFFFFF" stroke="#B68B48" stroke-width="3"/>
  <text class="latin" x="52" y="82" fill="#B68B48" font-size="18" font-weight="700" text-anchor="start" opacity="1.0" letter-spacing="3">03</text>
  <text class="serif" x="250" y="365" fill="#0D2F32" font-size="210" font-weight="700" text-anchor="middle" opacity="1.0" letter-spacing="0">颖</text>
  <path d="M70 440 H430" stroke="#B68B48" stroke-width="6"/>
  <text class="serif" x="250" y="535" fill="#0D2F32" font-size="40" font-weight="650" text-anchor="middle" opacity="1.0" letter-spacing="6">显现</text>
  <text class="sans" x="250" y="603" fill="#16191A" font-size="23" font-weight="350" text-anchor="middle" opacity="0.72" letter-spacing="0">末段抬升便于抽取</text>
</g>

<g transform="translate(1825 690)">
  <rect width="500" height="780" rx="40" fill="#0D2F32" stroke="#B68B48" stroke-width="3"/>
  <text class="latin" x="52" y="82" fill="#B68B48" font-size="18" font-weight="700" text-anchor="start" opacity="1.0" letter-spacing="3">04</text>
  <text class="serif" x="250" y="365" fill="#E8DFCC" font-size="210" font-weight="700" text-anchor="middle" opacity="1.0" letter-spacing="0">言</text>
  <path d="M70 440 H430" stroke="#B68B48" stroke-width="6"/>
  <text class="serif" x="250" y="535" fill="#E8DFCC" font-size="40" font-weight="650" text-anchor="middle" opacity="1.0" letter-spacing="6">连接</text>
  <text class="sans" x="250" y="603" fill="#E8DFCC" font-size="23" font-weight="350" text-anchor="middle" opacity="0.72" letter-spacing="0">纸卡与数字身份并行</text>
</g>

<g id="story-chain">
  <image href="../../04_renders/exploded.png" x="1050" y="1510" width="1280" height="1280" opacity="1.0" preserveAspectRatio="xMidYMid meet" />
  <text class="serif" x="160" y="1670" fill="#0D2F32" font-size="58" font-weight="720" text-anchor="start" opacity="1.0" letter-spacing="0">不是贴上一个成语</text>
  <text class="serif" x="160" y="1750" fill="#B68B48" font-size="39" font-weight="560" text-anchor="start" opacity="1.0" letter-spacing="0">而是让产品完成一次“脱颖而出”</text>
  <text class="sans" x="160" y="1870" fill="#16191A" font-size="28" font-weight="400" opacity="0.7"><tspan x="160" dy="0">用户推动内托，卡片沿楔形结构抬升。</tspan><tspan x="160" dy="52">动作本身成为典故的当代表达。</tspan></text>
  <rect x="160" y="2320" width="820" height="450" rx="36" fill="#0D2F32"/>
  <text class="sans" x="220" y="2415" fill="#B68B48" font-size="27" font-weight="650" text-anchor="start" opacity="1.0" letter-spacing="4">文化依据</text>
  <text class="sans" x="220" y="2495" fill="#E8DFCC" font-size="28" font-weight="400" opacity="0.86"><tspan x="220" dy="0">毛遂自荐、脱颖而出、一言九鼎</tspan><tspan x="220" dy="56">共同源自赵都邯郸的历史叙事。</tspan><tspan x="220" dy="56">本设计不复原人物肖像，不虚构文物。</tspan></text>
  <text class="sans" x="160" y="3060" fill="#16191A" font-size="18" font-weight="350" text-anchor="start" opacity="0.52" letter-spacing="0">资料：河北省文化和旅游厅《邯郸成语典故文化》；中央纪委国家监委网站“一言九鼎”典故说明。</text>
</g>


<g id="footer" opacity=".56">
  <path d="M160 3294 H2320" stroke="#16191A" stroke-width="2" opacity=".34"/>
  <text class="latin" x="160" y="3352" fill="#16191A" font-size="16" font-weight="560" text-anchor="start" opacity="1.0" letter-spacing="3">SUIJIAN · HANDAN IDIOM CULTURAL PRODUCT</text>
  <text class="latin" x="2320" y="3352" fill="#B68B48" font-size="18" font-weight="720" text-anchor="end" opacity="1.0" letter-spacing="2">02</text>
</g>

</svg>
