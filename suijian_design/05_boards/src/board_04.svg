</g>

<g transform="translate(170 2220)">
  <circle cx="0" cy="0" r="34" fill="#A64032"/>
  <text class="latin" x="0" y="8" fill="#FFFFFF" font-size="15" font-weight="720" text-anchor="middle" opacity="1.0" letter-spacing="0">04</text>
  <text class="serif" x="58" y="-2" fill="#0D2F32" font-size="28" font-weight="650" text-anchor="start" opacity="1.0" letter-spacing="0">金属饰条</text>
  <text class="sans" x="58" y="36" fill="#16191A" font-size="19" font-weight="350" text-anchor="start" opacity="0.64" letter-spacing="0">17°斜向视觉识别</text>
</g>

<g transform="translate(1560 2550)">
  <circle cx="0" cy="0" r="34" fill="#A64032"/>
  <text class="latin" x="0" y="8" fill="#FFFFFF" font-size="15" font-weight="720" text-anchor="middle" opacity="1.0" letter-spacing="0">05</text>
  <text class="serif" x="58" y="-2" fill="#0D2F32" font-size="28" font-weight="650" text-anchor="start" opacity="1.0" letter-spacing="0">卡片</text>
  <text class="sans" x="58" y="36" fill="#16191A" font-size="19" font-weight="350" text-anchor="start" opacity="0.64" letter-spacing="0">纸卡与 NFC 独立卡位</text>
</g>

</g>
<g id="engineering-strip">
  <rect x="160" y="2760" width="2160" height="360" rx="36" fill="#0D2F32"/>
  <text class="latin" x="220" y="2845" fill="#B68B48" font-size="18" font-weight="720" text-anchor="start" opacity="1.0" letter-spacing="4">ENGINEERING CREDIBILITY</text>
  <text class="latin" x="220" y="2940" fill="#E8DFCC" font-size="58" font-weight="650" text-anchor="start" opacity="1.0" letter-spacing="0">1.8 mm</text>
  <text class="sans" x="220" y="2990" fill="#E8DFCC" font-size="20" font-weight="350" text-anchor="start" opacity="0.64" letter-spacing="0">基准壁厚</text>
  <text class="latin" x="650" y="2940" fill="#E8DFCC" font-size="58" font-weight="650" text-anchor="start" opacity="1.0" letter-spacing="0">0.35 mm</text>
  <text class="sans" x="650" y="2990" fill="#E8DFCC" font-size="20" font-weight="350" text-anchor="start" opacity="0.64" letter-spacing="0">滑动面基准间隙</text>
  <text class="latin" x="1180" y="2940" fill="#E8DFCC" font-size="58" font-weight="650" text-anchor="start" opacity="1.0" letter-spacing="0">5 SOLIDS</text>
  <text class="sans" x="1180" y="2990" fill="#E8DFCC" font-size="20" font-weight="350" text-anchor="start" opacity="0.64" letter-spacing="0">STEP 重新打开验证</text>
  <text class="latin" x="1760" y="2940" fill="#E8DFCC" font-size="30" font-weight="650" text-anchor="start" opacity="1.0" letter-spacing="0">FCStd / STEP / STL</text>
  <text class="sans" x="1760" y="2990" fill="#E8DFCC" font-size="20" font-weight="350" text-anchor="start" opacity="0.64" letter-spacing="0">可编辑与可打样源文件</text>
</g>


<g id="footer" opacity=".56">
  <path d="M160 3294 H2320" stroke="#16191A" stroke-width="2" opacity=".34"/>
  <text class="latin" x="160" y="3352" fill="#16191A" font-size="16" font-weight="560" text-anchor="start" opacity="1.0" letter-spacing="3">SUIJIAN · HANDAN IDIOM CULTURAL PRODUCT</text>
  <text class="latin" x="2320" y="3352" fill="#B68B48" font-size="18" font-weight="720" text-anchor="end" opacity="1.0" letter-spacing="2">04</text>
</g>

