<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2480 3508" width="2480" height="3508">
<title>三秒完成一次自荐</title>

<defs>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="24" result="blur"/>
    <feOffset dy="34" result="offset"/>
    <feColorMatrix in="offset" type="matrix" values="0 0 0 0 0.02 0 0 0 0 0.12 0 0 0 0 0.13 0 0 0 .28 0"/>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <linearGradient id="goldLine" x1="0" y1="1" x2="1" y2="0">
    <stop offset="0" stop-color="#8D672F"/><stop offset=".55" stop-color="#B68B48"/><stop offset="1" stop-color="#E0BD79"/>
  </linearGradient>
  <radialGradient id="deepGlow" cx="78%" cy="18%" r="84%">
    <stop offset="0" stop-color="#1C5557"/><stop offset=".56" stop-color="#0D2F32"/><stop offset="1" stop-color="#071E20"/>
  </radialGradient>
  <style>
    @font-face { font-family:'Noto Sans SC'; src:url('../../01_research/fonts/NotoSansSC%5Bwght%5D.ttf'); }
    @font-face { font-family:'Noto Serif SC'; src:url('../../01_research/fonts/NotoSerifSC%5Bwght%5D.ttf'); }
    @font-face { font-family:'Inter'; src:url('../../01_research/fonts/InterVariable.ttf'); }
    .sans { font-family:'Noto Sans SC',sans-serif; }
    .serif { font-family:'Noto Serif SC',serif; }
    .latin { font-family:'Inter',sans-serif; }
  </style>
</defs>

<rect width="2480" height="3508" fill="url(#deepGlow)"/>

<path d="M-180 3060 L2680 2210" stroke="#B68B48" stroke-width="4" opacity=".13"/>
<circle cx="2290" cy="170" r="12" fill="#A64032"/>


<g id="header">
  <text class="latin" x="160" y="188" fill="#B68B48" font-size="22" font-weight="700" text-anchor="start" opacity="1.0" letter-spacing="4">03 / 07</text>
  <text class="serif" x="160" y="318" fill="#E8DFCC" font-size="92" font-weight="720" text-anchor="start" opacity="1.0" letter-spacing="4">三秒完成一次自荐</text>
  <text class="sans" x="162" y="380" fill="#E8DFCC" font-size="27" font-weight="350" text-anchor="start" opacity="0.68" letter-spacing="2">ONE MOTION · 三个状态使用同一套 CAD 几何与相机语言</text>
  <path d="M160 442 H2320" stroke="#B68B48" stroke-width="4" opacity=".65"/>
</g>



<g transform="translate(120 690)">
  <rect width="740" height="1320" rx="48" fill="#F3EEE2" opacity=".98"/>
  <image href="../../04_renders/interaction_01.png" x="10" y="120" width="720" height="720" opacity="1.0" preserveAspectRatio="xMidYMid meet" />
  <text class="serif" x="58" y="920" fill="#0D2F32" font-size="66" font-weight="720" text-anchor="start" opacity="1.0" letter-spacing="0">闭合</text>
  <text class="latin" x="58" y="978" fill="#B68B48" font-size="18" font-weight="700" text-anchor="start" opacity="1.0" letter-spacing="3">01 · READY</text>
  <path d="M58 1032 H682" stroke="#B68B48" stroke-width="3"/>
  <text class="sans" x="58" y="1110" fill="#16191A" font-size="25" font-weight="400" opacity="0.7"><tspan x="58" dy="0">掌心尺寸，完整收纳</tspan><tspan x="58" dy="48">磁吸止位形成闭合反馈</tspan></text>
</g>

<g transform="translate(910 690)">
  <rect width="740" height="1320" rx="48" fill="#F3EEE2" opacity=".98"/>
  <image href="../../04_renders/interaction_02.png" x="10" y="120" width="720" height="720" opacity="1.0" preserveAspectRatio="xMidYMid meet" />
  <text class="serif" x="58" y="920" fill="#0D2F32" font-size="66" font-weight="720" text-anchor="start" opacity="1.0" letter-spacing="0">推出</text>
  <text class="latin" x="58" y="978" fill="#B68B48" font-size="18" font-weight="700" text-anchor="start" opacity="1.0" letter-spacing="3">02 · MOVE</text>
  <path d="M58 1032 H682" stroke="#B68B48" stroke-width="3"/>
  <text class="sans" x="58" y="1110" fill="#16191A" font-size="25" font-weight="400" opacity="0.7"><tspan x="58" dy="0">拇指推动内托</tspan><tspan x="58" dy="48">结构沿单一导轨移动</tspan></text>
</g>

<g transform="translate(1700 690)">
  <rect width="740" height="1320" rx="48" fill="#F3EEE2" opacity=".98"/>
  <image href="../../04_renders/interaction_03.png" x="10" y="120" width="720" height="720" opacity="1.0" preserveAspectRatio="xMidYMid meet" />
  <text class="serif" x="58" y="920" fill="#0D2F32" font-size="66" font-weight="720" text-anchor="start" opacity="1.0" letter-spacing="0">显现</text>
  <text class="latin" x="58" y="978" fill="#B68B48" font-size="18" font-weight="700" text-anchor="start" opacity="1.0" letter-spacing="3">03 · REVEAL</text>
  <path d="M58 1032 H682" stroke="#B68B48" stroke-width="3"/>
  <text class="sans" x="58" y="1110" fill="#16191A" font-size="25" font-weight="400" opacity="0.7"><tspan x="58" dy="0">末段抬升 7 mm</tspan><tspan x="58" dy="48">三秒内完成展示与取卡</tspan></text>
</g>

<g id="dimension-strip">
  <rect x="160" y="2190" width="2160" height="680" rx="46" fill="#071E20" stroke="#B68B48" stroke-width="3"/>
  <text class="latin" x="220" y="2284" fill="#B68B48" font-size="18" font-weight="720" text-anchor="start" opacity="1.0" letter-spacing="4">PRODUCT BASELINE</text>
  <text class="latin" x="220" y="2440" fill="#E8DFCC" font-size="105" font-weight="660" text-anchor="start" opacity="1.0" letter-spacing="1">98 × 65 × 14</text>
  <text class="latin" x="1030" y="2440" fill="#B68B48" font-size="36" font-weight="560" text-anchor="start" opacity="1.0" letter-spacing="0">mm</text>
  <text class="sans" x="220" y="2520" fill="#E8DFCC" font-size="21" font-weight="350" text-anchor="start" opacity="0.58" letter-spacing="2">闭合尺寸 / PARAMETRIC CAD BASELINE</text>
  <text class="latin" x="1260" y="2360" fill="#E8DFCC" font-size="66" font-weight="650" text-anchor="start" opacity="1.0" letter-spacing="0">28 mm</text>
  <text class="sans" x="1260" y="2425" fill="#B68B48" font-size="20" font-weight="450" text-anchor="start" opacity="1.0" letter-spacing="2">滑动行程 TRAVEL</text>
  <text class="latin" x="1740" y="2360" fill="#E8DFCC" font-size="66" font-weight="650" text-anchor="start" opacity="1.0" letter-spacing="0">7 mm</text>
  <text class="sans" x="1740" y="2425" fill="#B68B48" font-size="20" font-weight="450" text-anchor="start" opacity="1.0" letter-spacing="2">末段抬升 LIFT</text>
  <path d="M1260 2538 H2190" stroke="#B68B48" stroke-width="3" opacity=".42"/>
  <text class="sans" x="1260" y="2620" fill="#E8DFCC" font-size="24" font-weight="360" text-anchor="start" opacity="0.74" letter-spacing="0">兼容 90×54 mm / 85.6×54 mm 常用卡片</text>
  <text class="sans" x="1260" y="2680" fill="#E8DFCC" font-size="24" font-weight="360" text-anchor="start" opacity="0.74" letter-spacing="0">建议容量 8–10 张 0.3 mm 纸质名片</text>
</g>


<g id="footer" opacity=".56">
  <path d="M160 3294 H2320" stroke="#E8DFCC" stroke-width="2" opacity=".34"/>
  <text class="latin" x="160" y="3352" fill="#E8DFCC" font-size="16" font-weight="560" text-anchor="start" opacity="1.0" letter-spacing="3">SUIJIAN · HANDAN IDIOM CULTURAL PRODUCT</text>
  <text class="latin" x="2320" y="3352" fill="#B68B48" font-size="18" font-weight="720" text-anchor="end" opacity="1.0" letter-spacing="2">03</text>
</g>

</svg>
