  <image href="../../04_renders/hero_closed.png" x="150" y="1790" width="870" height="610" opacity="1.0" preserveAspectRatio="xMidYMid meet" />
  <text class="latin" x="1040" y="1945" fill="#E8DFCC" font-size="74" font-weight="650" text-anchor="start" opacity="1.0" letter-spacing="0">65%</text>
  <text class="sans" x="1040" y="2002" fill="#E8DFCC" font-size="22" font-weight="350" text-anchor="start" opacity="0.62" letter-spacing="0">赵漆青主体</text>
  <text class="latin" x="1390" y="1945" fill="#E8DFCC" font-size="74" font-weight="650" text-anchor="start" opacity="1.0" letter-spacing="0">25%</text>
  <text class="sans" x="1390" y="2002" fill="#E8DFCC" font-size="22" font-weight="350" text-anchor="start" opacity="0.62" letter-spacing="0">帛白信息层</text>
  <text class="latin" x="1740" y="1945" fill="#E8DFCC" font-size="74" font-weight="650" text-anchor="start" opacity="1.0" letter-spacing="0">8%</text>
  <text class="sans" x="1740" y="2002" fill="#E8DFCC" font-size="22" font-weight="350" text-anchor="start" opacity="0.62" letter-spacing="0">鼎金结构点</text>
  <text class="latin" x="2040" y="1945" fill="#E8DFCC" font-size="74" font-weight="650" text-anchor="start" opacity="1.0" letter-spacing="0">≤2%</text>
  <text class="sans" x="2040" y="2002" fill="#E8DFCC" font-size="22" font-weight="350" text-anchor="start" opacity="0.62" letter-spacing="0">誓朱提示</text>
  <path d="M1040 2085 H2180" stroke="#B68B48" stroke-width="4" opacity=".56"/>
  <text class="latin" x="1040" y="2170" fill="#E8DFCC" font-size="23" font-weight="560" text-anchor="start" opacity="1.0" letter-spacing="3">MATTE PC+ABS</text>
  <text class="latin" x="1450" y="2170" fill="#E8DFCC" font-size="23" font-weight="560" text-anchor="start" opacity="1.0" letter-spacing="3">ANODISED ALUMINIUM</text>
  <text class="latin" x="1990" y="2170" fill="#E8DFCC" font-size="23" font-weight="560" text-anchor="start" opacity="1.0" letter-spacing="3">PAPER</text>
</g>

<g transform="translate(160 2640)">
  <rect width="350" height="170" rx="26" fill="#0D2F32" stroke="#B68B48" stroke-width="2"/>
  <text class="sans" x="0" y="224" fill="#E8DFCC" font-size="25" font-weight="520" text-anchor="start" opacity="1.0" letter-spacing="0">赵漆青</text>
  <text class="latin" x="350" y="224" fill="#B68B48" font-size="16" font-weight="560" text-anchor="end" opacity="1.0" letter-spacing="2">#0D2F32</text>
</g>

<g transform="translate(570 2640)">
  <rect width="350" height="170" rx="26" fill="#B68B48" stroke="#B68B48" stroke-width="2"/>
  <text class="sans" x="0" y="224" fill="#E8DFCC" font-size="25" font-weight="520" text-anchor="start" opacity="1.0" letter-spacing="0">鼎金</text>
  <text class="latin" x="350" y="224" fill="#B68B48" font-size="16" font-weight="560" text-anchor="end" opacity="1.0" letter-spacing="2">#B68B48</text>
</g>

<g transform="translate(980 2640)">
  <rect width="350" height="170" rx="26" fill="#A64032" stroke="#B68B48" stroke-width="2"/>
  <text class="sans" x="0" y="224" fill="#E8DFCC" font-size="25" font-weight="520" text-anchor="start" opacity="1.0" letter-spacing="0">誓朱</text>
  <text class="latin" x="350" y="224" fill="#B68B48" font-size="16" font-weight="560" text-anchor="end" opacity="1.0" letter-spacing="2">#A64032</text>
</g>

<g transform="translate(1390 2640)">
  <rect width="350" height="170" rx="26" fill="#E8DFCC" stroke="#B68B48" stroke-width="2"/>
  <text class="sans" x="0" y="224" fill="#E8DFCC" font-size="25" font-weight="520" text-anchor="start" opacity="1.0" letter-spacing="0">帛白</text>
  <text class="latin" x="350" y="224" fill="#B68B48" font-size="16" font-weight="560" text-anchor="end" opacity="1.0" letter-spacing="2">#E8DFCC</text>
</g>



<g id="footer" opacity=".56">
  <path d="M160 3294 H2320" stroke="#E8DFCC" stroke-width="2" opacity=".34"/>
  <text class="latin" x="160" y="3352" fill="#E8DFCC" font-size="16" font-weight="560" text-anchor="start" opacity="1.0" letter-spacing="3">SUIJIAN · HANDAN IDIOM CULTURAL PRODUCT</text>
  <text class="latin" x="2320" y="3352" fill="#B68B48" font-size="18" font-weight="720" text-anchor="end" opacity="1.0" letter-spacing="2">05</text>
</g>

</svg>
